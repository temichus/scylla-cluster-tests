# Jepsen on Strong Consistency tables.
# Plan: docs/plans/testing/jepsen-strong-consistency.md. The gate is one run per command
# and every run must pass (step 1.5); the `test-all-sc` command itself lands with fork
# step 2.6 and the test_metadata with step 3.1.
test_duration: 720
cluster_backend: 'gce'
gce_image_username: 'sct'
gce_image_db: 'https://www.googleapis.com/compute/v1/projects/debian-cloud/global/images/family/debian-12'
gce_image_loader: 'https://www.googleapis.com/compute/v1/projects/debian-cloud/global/images/family/debian-12'
gce_instance_type_db: 'n2-standard-4'
gce_instance_type_loader: 'n2-highmem-8'
gce_root_disk_type_db: 'pd-ssd'
root_disk_size_db: 50
gce_n_local_ssd_disk_db: 1
n_db_nodes: 5
n_loaders: 1
nemesis_class_name: 'NoOpMonkey'  # Jepsen is the nemesis
scylla_linux_distro: 'debian-bookworm'
use_preinstalled_scylla: false
user_prefix: 'jepsen-sc'
bare_loaders: true  # Jepsen is the loader

experimental_features:
  - strongly-consistent-tables

jepsen_scylla_repo: 'https://github.com/scylladb/jepsen.git'
jepsen_test_cmd:
  - 'test-all-sc --concurrency 5n --time-limit 300'
jepsen_test_count: 1
jepsen_test_run_policy: all
